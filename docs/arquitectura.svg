<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura hexagonal de NEXUS</title>
  <desc id="desc">Cliente React se comunica por HTTP con Express; Express invoca casos de uso que aplican reglas del dominio y dependen de puertos implementados por adaptadores PostgreSQL, bcrypt y JWT.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b0c10"/><stop offset="1" stop-color="#171b22"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c5f467"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f4f4f3}.title{font-size:34px;font-weight:800;letter-spacing:2px}.subtitle{font-size:15px;fill:#a9adb5}.section{font-size:13px;font-weight:700;letter-spacing:1.8px;fill:#c5f467}.heading{font-size:19px;font-weight:700}.body{font-size:14px;fill:#d4d6da}.small{font-size:12px;fill:#a9adb5}.card{fill:#11151b;stroke:#343a43;stroke-width:1.5}.inner{fill:#171d24;stroke:#404752;stroke-width:1.2}.accent{stroke:#c5f467;stroke-width:3;fill:none;marker-end:url(#arrow)}.mutedline{stroke:#8f9a82;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="880" rx="24" fill="url(#bg)"/>
  <text x="56" y="66" class="title">NEXUS · ARQUITECTURA HEXAGONAL</text>
  <text x="56" y="96" class="subtitle">Comercio electrónico · Node.js + Express · PostgreSQL · React + Vite · WSL</text>

  <text x="56" y="151" class="section">ADAPTADOR DE ENTRADA</text>
  <rect x="56" y="170" width="270" height="220" rx="16" class="card"/>
  <text x="80" y="209" class="heading">Cliente web</text>
  <rect x="80" y="232" width="222" height="58" rx="10" class="inner"/>
  <text x="98" y="257" class="body">React + Vite (SPA)</text><text x="98" y="277" class="small">Módulos: auth · catálogo · pedidos</text>
  <rect x="80" y="307" width="222" height="58" rx="10" class="inner"/>
  <text x="98" y="332" class="body">Servicio frontend</text><text x="98" y="352" class="small">services/api.js · JSON / HTTP</text>

  <text x="378" y="151" class="section">INFRAESTRUCTURA · ENTRADA</text>
  <rect x="378" y="170" width="280" height="220" rx="16" class="card"/>
  <text x="402" y="209" class="heading">Express REST API</text>
  <rect x="402" y="232" width="232" height="58" rx="10" class="inner"/>
  <text x="420" y="257" class="body">Rutas y controladores</text><text x="420" y="277" class="small">/api/auth · /users · /products · /orders</text>
  <rect x="402" y="307" width="232" height="58" rx="10" class="inner"/>
  <text x="420" y="332" class="body">Middleware</text><text x="420" y="352" class="small">JWT · autorización admin / propietario</text>

  <text x="714" y="151" class="section">APLICACIÓN</text>
  <rect x="714" y="170" width="300" height="220" rx="16" class="card"/>
  <text x="738" y="209" class="heading">Casos de uso</text>
  <text x="738" y="247" class="body">Autenticación y usuarios</text>
  <text x="738" y="278" class="body">Administración de productos</text>
  <text x="738" y="309" class="body">Creación y seguimiento de pedidos</text>
  <text x="738" y="352" class="small">Coordina reglas; no conoce Express ni SQL.</text>

  <text x="1070" y="151" class="section">DOMINIO</text>
  <rect x="1070" y="170" width="314" height="220" rx="16" class="card"/>
  <text x="1094" y="209" class="heading">Entidades y reglas</text>
  <rect x="1094" y="232" width="266" height="38" rx="8" class="inner"/><text x="1110" y="257" class="body">Usuario · rol · validación de contraseña</text>
  <rect x="1094" y="280" width="266" height="38" rx="8" class="inner"/><text x="1110" y="305" class="body">Producto · precio · inventario</text>
  <rect x="1094" y="328" width="266" height="38" rx="8" class="inner"/><text x="1110" y="353" class="body">Pedido · stock · cálculo de total</text>

  <path d="M326 280H370" class="accent"/><text x="328" y="264" class="small">HTTP</text>
  <path d="M658 280H706" class="accent"/><text x="660" y="264" class="small">invoca</text>
  <path d="M1014 280H1062" class="accent"/><text x="1016" y="264" class="small">aplica reglas</text>

  <text x="56" y="452" class="section">PUERTOS DE SALIDA · DEFINIDOS POR LA APLICACIÓN</text>
  <rect x="56" y="470" width="620" height="170" rx="16" class="card"/>
  <text x="82" y="508" class="heading">Contratos que consumen los casos de uso</text>
  <rect x="82" y="530" width="270" height="42" rx="9" class="inner"/><text x="98" y="557" class="body">UserRepository · ProductRepository</text>
  <rect x="368" y="530" width="300" height="42" rx="9" class="inner"/><text x="384" y="557" class="body">OrderRepository · PasswordHasher</text>
  <text x="82" y="608" class="small">El dominio y la aplicación no dependen del motor de base de datos.</text>

  <text x="714" y="452" class="section">INFRAESTRUCTURA · ADAPTADORES DE SALIDA</text>
  <rect x="714" y="470" width="670" height="170" rx="16" class="card"/>
  <rect x="740" y="510" width="270" height="80" rx="10" class="inner"/>
  <text x="760" y="541" class="heading">PostgresRepository</text><text x="760" y="566" class="small">Consultas parametrizadas · transacciones</text>
  <rect x="1030" y="510" width="160" height="80" rx="10" class="inner"/>
  <text x="1050" y="541" class="heading">bcrypt</text><text x="1050" y="566" class="small">Hash de credenciales</text>
  <rect x="1210" y="510" width="148" height="80" rx="10" class="inner"/>
  <text x="1230" y="541" class="heading">JWT</text><text x="1230" y="566" class="small">Tokens de sesión</text>
  <path d="M714 550H684" class="mutedline"/><path d="M1010 550H1022" class="mutedline"/>

  <rect x="56" y="696" width="1328" height="112" rx="16" fill="#101710" stroke="#4b6133" stroke-width="1.5"/>
  <text x="82" y="736" class="section">PERSISTENCIA</text>
  <text x="82" y="773" class="heading">PostgreSQL</text>
  <text x="232" y="773" class="body">users</text><text x="322" y="773" class="body">products</text><text x="438" y="773" class="body">orders</text><text x="535" y="773" class="body">order_items</text>
  <text x="780" y="749" class="small">Pedido y partidas se guardan en una transacción:</text>
  <text x="780" y="776" class="body">si falta stock, se revierte la operación completa.</text>
  <path d="M850 640V680" class="mutedline"/>
  <text x="56" y="848" class="small">Flechas sólidas: flujo de la solicitud. Flechas punteadas: adaptadores que implementan puertos.</text>
</svg>
